# Coverctl v1 policy. Shared go-ci runs `coverctl check --from-profile --profile=coverage.out`.
# Exclude patterns use filepath.Match (* does not cross '/'); one pattern per path depth.
version: 1
language: go
policy:
  default:
    min: 70
  domains:
    - name: module
      match:
        - ./...
      exclude:
        - example/*
        - example/*/*
        - cmd/*
        - cmd/*/*
        # OS hosts are CGO/stub adapters; gate kernel + app + null host instead.
        - platform/linux/*
        - platform/linux/*/*
        - platform/darwin/*
        - platform/darwin/*/*
        - platform/windows/*
        - platform/windows/*/*
      min: 70
