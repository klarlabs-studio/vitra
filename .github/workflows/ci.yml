# Thin caller for the shared klarlabs-studio Go CI bar, plus Linux native host E2E.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    # Stacked phase PRs target non-main bases; still need status checks.
    # No paths-ignore: branch protection requires this workflow's status
    # checks. Docs-only PRs must still report them.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: klarlabs-studio/.github/.github/workflows/go-ci.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    secrets: inherit
    with:
      coverage: true

  # Competitive Linux WebView host — not covered by the shared go-ci bar (CGO + GTK).
  native:
    name: Native Linux E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install WebKitGTK / GTK / xvfb
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            pkg-config \
            xvfb \
            build-essential

      - name: Build native packages
        run: make build-native

      - name: Eval → invoke → gateway E2E
        run: make e2e
