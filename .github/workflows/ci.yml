# Thin caller for the shared klarlabs-studio Go CI bar, plus Linux native host E2E.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    # Stacked phase PRs target non-main bases; still need status checks.
    # No paths-ignore: branch protection requires this workflow's status
    # checks. Docs-only PRs must still report them.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: klarlabs-studio/.github/.github/workflows/go-ci.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    secrets: inherit
    with:
      coverage: true

  # The shared go-ci bar only builds on Linux; `go install .../cmd/vitra` must
  # also work on Darwin and Windows hosts (OS-suffixed files broke this once).
  cross-build:
    name: Cross-build CLI (darwin, windows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        goos: [darwin, windows]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and vet
        env:
          GOOS: ${{ matrix.goos }}
        run: |
          go build ./cmd/vitra ./internal/packaging ./app .
          go vet ./cmd/vitra ./internal/packaging ./app .

  # Starter templates are copied by every `vitra new`; build each frontend so
  # dependency bumps (Dependabot) cannot break them unnoticed.
  templates:
    name: Template build (${{ matrix.template }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        template: [vite, react, svelte, vue]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Scaffold, build frontend, build app
        env:
          VITRA_MODULE_PATH: ${{ github.workspace }}
          TEMPLATE: ${{ matrix.template }}
        run: |
          go run ./cmd/vitra new "$RUNNER_TEMP/app" --template "$TEMPLATE"
          cd "$RUNNER_TEMP/app/frontend"
          npm install --no-audit --no-fund
          npm run build
          test -f dist/index.html
          cd ..
          go mod tidy
          go build -o /dev/null .

  # Darwin and Windows native hosts only compile with cgo on their own OS, so
  # cross-builds never see them. Build (and unit-test) them on real runners.
  native-build:
    name: Native build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build with -tags vitra_native
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          go build -tags vitra_native ./...
          go vet -tags vitra_native ./app/... ./platform/... ./example/...

      - name: Unit tests (native tag)
        shell: bash
        env:
          CGO_ENABLED: "1"
        # Each runner tests its own host package; the others are covered on
        # their own OS (their tests assume that OS's paths and locks).
        run: |
          host=$([ "$RUNNER_OS" = "Windows" ] && echo windows || echo darwin)
          go test -tags vitra_native -count=1 ./app/... ./desktop/... ./platform "./platform/$host/..."

  # Competitive Linux WebView host — not covered by the shared go-ci bar (CGO + GTK).
  native:
    name: Native Linux E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install WebKitGTK / GTK / xvfb
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            pkg-config \
            xvfb \
            build-essential

      - name: Build native packages
        run: make build-native

      - name: Native window chrome
        run: make test-native

      - name: Eval → invoke → gateway E2E
        run: make e2e
