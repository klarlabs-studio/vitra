# Publishes the vitra CLI when a v* tag is pushed: GoReleaser builds the
# archives, SBOMs, and checksums and signs the checksums with keyless
# cosign; the SLSA generator attaches build provenance to the release.
# macOS notarization and Windows Authenticode signing turn on when their
# secrets exist (CONTRIBUTING.md, "Code-signing certificates").
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # keyless cosign signing
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # Windows Authenticode signing (scripts/sign-windows.sh) needs
      # osslsigncode, but only once the certificate secret exists. Only a
      # boolean reaches this step, never the secret.
      - name: Install osslsigncode
        env:
          SIGN_WINDOWS: ${{ secrets.WINDOWS_SIGN_PFX != '' }}
        run: |
          if [ "$SIGN_WINDOWS" = "true" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq osslsigncode
          else
            echo "WINDOWS_SIGN_PFX not set; Windows binaries stay unsigned."
          fi

      # The signing secrets are optional. While they are absent, GoReleaser
      # skips macOS notarization and the Windows hook exits early, so the
      # release is built exactly as before.
      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          WINDOWS_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}

      - name: Provenance subjects
        id: hash
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          set -euo pipefail
          checksums=$(echo "$ARTIFACTS" | jq -r '.[] | select(.type == "Checksum") | .path')
          echo "hashes=$(base64 -w0 < "$checksums")" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: [goreleaser]
    permissions:
      actions: read # read the workflow run
      id-token: write # sign the provenance
      contents: write # upload it to the release
    # The SLSA generator must be referenced by tag, not SHA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true
