<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitra App</title>
  <style>
    :root { color-scheme: light dark; --accent: #2f5bd3; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(440px, 100% - 32px); }
    h1 { margin: 0 0 4px; font-size: 28px; }
    p { margin: 0 0 20px; opacity: .7; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px 12px; font: inherit; border: 1px solid #8886; border-radius: 8px; }
    button { padding: 10px 16px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
    output { display: block; margin-top: 16px; min-height: 1.5em; }
    .error { color: #c4321f; }
  </style>
</head>
<body>
  <main>
    <h1>Hello from Vitra</h1>
    <p>This page can call one Go command, <code>greet</code>, because main.go grants it. Everything else is refused.</p>
    <form id="form">
      <input id="name" placeholder="Your name" aria-label="Your name" autocomplete="off">
      <button>Greet</button>
    </form>
    <output id="out" aria-live="polite"></output>
  </main>
  <script>
    const out = document.getElementById("out");
    document.getElementById("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try {
        const res = await window.vitra.invoke("greet", { name: document.getElementById("name").value });
        out.className = "";
        out.textContent = res.message;
      } catch (err) {
        out.className = "error";
        out.textContent = (err.code ? err.code + ": " : "") + err.message;
      }
    });
  </script>
</body>
</html>
