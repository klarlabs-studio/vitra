<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vitra</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e7ecf1;
      --muted: #9aa7b5;
      --accent: #3dd6c6;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--text); background:
        radial-gradient(1200px 600px at 10% -10%, #1d3a3a 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #243048 0%, transparent 50%),
        var(--bg);
      display: grid; place-items: center; padding: 2rem;
    }
    main { width: min(640px, 100%); }
    h1 { font-family: "IBM Plex Serif", Georgia, serif; font-weight: 500; font-size: 2.4rem; margin: 0 0 .4rem; }
    p { color: var(--muted); margin: 0 0 1.5rem; line-height: 1.5; }
    .row { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
    input, button {
      border: 0; border-radius: 10px; padding: .85rem 1rem; font: inherit;
    }
    input { flex: 1; background: var(--panel); color: var(--text); outline: 2px solid transparent; }
    input:focus { outline-color: var(--accent); }
    button { background: var(--accent); color: #04221f; font-weight: 600; cursor: pointer; }
    button.secondary { background: #2a3442; color: var(--text); }
    pre {
      background: var(--panel); border-radius: 12px; padding: 1rem; min-height: 7rem;
      white-space: pre-wrap; color: #c9f7ef; font-size: .92rem;
    }
    .err { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <h1>Vitra</h1>
    <p>Secure Go ↔ web desktop runtime. Invokes cross the capability gateway with host-stamped identity — not ambient Wails-style exports.</p>
    <div class="row">
      <input id="name" placeholder="Your name" value="Klarlabs" />
      <button id="greet">Invoke demo.greet</button>
      <button id="clip" class="secondary">Clipboard round-trip</button>
      <button id="browser" class="secondary">Open vitra docs</button>
      <button id="open" class="secondary">Open file</button>
      <button id="opendir" class="secondary">Open folder</button>
      <button id="save" class="secondary">Save file</button>
      <button id="msg" class="secondary">Message dialog</button>
      <button id="notify" class="secondary">Notify</button>
      <button id="path" class="secondary">Open temp dir</button>
      <button id="win" class="secondary">Open aux window</button>
      <button id="chrome" class="secondary">Apply window.chrome</button>
      <button id="getChrome" class="secondary">Read window.getChrome</button>
      <button id="focus" class="secondary">Focus window.focus</button>
      <button id="menu" class="secondary">Set menu bar</button>
      <button id="menuClear" class="secondary">Clear menu bar</button>
      <button id="tray" class="secondary">Set tray</button>
      <button id="trayClear" class="secondary">Clear tray</button>
      <button id="drop" class="secondary">Enable file drops</button>
      <button id="shortcut" class="secondary">Register shortcut</button>
      <button id="shortcutUnreg" class="secondary">Unregister shortcut</button>
      <button id="quit" class="secondary">Quit app</button>
    </div>
    <pre id="out">Ready.</pre>
  </main>
  <script>
    const out = document.getElementById("out");
    function show(v, isErr) {
      out.className = isErr ? "err" : "";
      out.textContent = typeof v === "string" ? v : JSON.stringify(v, null, 2);
    }
    if (window.vitra && window.vitra.on) {
      window.vitra.on("demo.tick", (payload) => show({ event: "demo.tick", payload }));
      window.vitra.on("dragdrop.drop", (payload) => show({ event: "dragdrop.drop", payload }));
      window.vitra.on("deeplink.open", (payload) => show({ event: "deeplink.open", payload }));
      window.vitra.on("menu.action", (payload) => show({ event: "menu.action", payload }));
      window.vitra.on("tray.action", (payload) => show({ event: "tray.action", payload }));
      window.vitra.on("shortcut.action", (payload) => show({ event: "shortcut.action", payload }));
    }
    document.getElementById("greet").onclick = async () => {
      try {
        const name = document.getElementById("name").value;
        const res = await window.vitra.invoke("demo.greet", name);
        show(res);
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("clip").onclick = async () => {
      try {
        await window.vitra.invoke("clipboard.write", "vitra-clipboard-" + Date.now());
        const text = await window.vitra.invoke("clipboard.read");
        show({ clipboard: text });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("browser").onclick = async () => {
      try {
        await window.vitra.invoke("browser.open", "https://go.klarlabs.de/vitra");
        show({ opened: "https://go.klarlabs.de/vitra" });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("open").onclick = async () => {
      try {
        show({
          open: await window.vitra.invoke("dialog.open", {
            title: "Open file",
            filters: [{ name: "Text", extensions: ["txt", "md"] }],
          }),
        });
      } catch (e) { show(String(e.message || e), true); }
    };
    document.getElementById("opendir").onclick = async () => {
      try { show({ openDirectory: await window.vitra.invoke("dialog.openDirectory") }); }
      catch (e) { show(String(e.message || e), true); }
    };
    document.getElementById("save").onclick = async () => {
      try {
        show({
          save: await window.vitra.invoke("dialog.save", {
            title: "Save file",
            filters: [{ name: "Text", extensions: ["txt"] }],
          }),
        });
      } catch (e) { show(String(e.message || e), true); }
    };
    document.getElementById("msg").onclick = async () => {
      try {
        show({
          message: await window.vitra.invoke("dialog.message", {
            title: "Vitra",
            message: "Confirm competitive dialog.message?",
            kind: "confirm",
          }),
        });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("notify").onclick = async () => {
      try {
        await window.vitra.invoke("notifications.show", {
          title: "Vitra",
          body: "Hello from competitive demo",
        });
        show({ notified: true });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("path").onclick = async () => {
      try {
        // Absolute path; grant PathScope is /** in the competitive demo.
        const target = "/tmp";
        await window.vitra.invoke("path.open", target);
        show({ opened: target });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("win").onclick = async () => {
      try {
        show({
          window: await window.vitra.invoke("window.create", {
            id: "aux",
            title: "Vitra Aux",
            width: 480,
            height: 360,
          }),
        });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("chrome").onclick = async () => {
      try {
        await window.vitra.invoke("window.chrome", {
          id: "main",
          title: "Vitra Chrome",
          width: 900,
          height: 600,
        });
        show({ chrome: { id: "main", title: "Vitra Chrome", width: 900, height: 600 } });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("getChrome").onclick = async () => {
      try {
        show({ chrome: await window.vitra.invoke("window.getChrome", { id: "main" }) });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("focus").onclick = async () => {
      try {
        await window.vitra.invoke("window.focus", { id: "main" });
        show({ focus: "main" });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("menu").onclick = async () => {
      try {
        await window.vitra.invoke("menu.set", [
          { menu: "File", id: "app.quit", label: "Quit", shortcut: "Ctrl+Q" },
          { menu: "Help", id: "help.about", label: "About Vitra" },
        ]);
        show({ menu: "set" });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("menuClear").onclick = async () => {
      try {
        await window.vitra.invoke("menu.clear");
        show({ menu: "cleared" });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("tray").onclick = async () => {
      try {
        await window.vitra.invoke("tray.set", {
          tooltip: "Vitra competitive demo",
          items: [
            { id: "help.about", label: "About Vitra" },
            { id: "tray.quit", label: "Quit" },
          ],
        });
        show({ tray: "set" });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("trayClear").onclick = async () => {
      try {
        await window.vitra.invoke("tray.clear");
        show({ tray: "cleared" });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("drop").onclick = async () => {
      try {
        await window.vitra.invoke("dragdrop.receive", { id: "main", enabled: true });
        show({ dragdrop: "enabled" });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("shortcut").onclick = async () => {
      try {
        await window.vitra.invoke("shortcut.register", {
          accelerator: "Ctrl+Shift+Q",
          action: "app.quit",
        });
        show({ shortcut: "registered" });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("shortcutUnreg").onclick = async () => {
      try {
        await window.vitra.invoke("shortcut.unregister", {
          accelerator: "Ctrl+Shift+Q",
        });
        show({ shortcut: "unregistered" });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
    document.getElementById("quit").onclick = async () => {
      try {
        await window.vitra.invoke("app.quit");
        show({ quit: true });
      } catch (e) {
        show(String(e.message || e), true);
      }
    };
  </script>
</body>
</html>
